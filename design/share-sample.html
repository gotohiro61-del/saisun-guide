<style>
  :root {
    --navy: #16304F;
    --ink: #101820;
    --muted: #5A6472;
    --ground: #EFF2F5;
    --surface: #FFFFFF;
    --line: #D8DEE6;
    --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#0E1620; --surface:#18222E; --ink:#E8EDF3; --muted:#9AA7B6; --line:#27384B; --navy:#1D3E63; }
  }
  :root[data-theme="dark"] { --ground:#0E1620; --surface:#18222E; --ink:#E8EDF3; --muted:#9AA7B6; --line:#27384B; --navy:#1D3E63; }
  :root[data-theme="light"] { --ground:#EFF2F5; --surface:#FFFFFF; --ink:#101820; --muted:#5A6472; --line:#D8DEE6; --navy:#16304F; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  .sheet { max-width: 520px; margin: 0 auto; padding: 40px 20px 64px; }
  :focus-visible { outline: 3px solid #F2C230; outline-offset: 3px; }

  h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: -.01em; }
  .sub { margin: 0 0 28px; font-size: 14px; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 24px 20px; margin-bottom: 20px;
  }
  .card figure { margin: 0; }
  .card svg.measure { width: 100%; height: auto; display: block; }
  figcaption { margin-top: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  .qr-card { text-align: center; }
  .qr-card h2 { margin: 0 0 6px; font-size: 17px; }
  .qr-card p { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); }
  .plaque {
    width: 240px; max-width: 100%; aspect-ratio: 1 / 1;
    margin: 0 auto; padding: 14px;
    background: #FFFFFF; border: 1px solid #E2E7ED; border-radius: 6px;
  }
  .plaque svg { width: 100%; height: 100%; display: block; }
  .btn {
    display: inline-block; margin-top: 20px;
    background: var(--navy); color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 700; padding: 13px 22px; border-radius: 6px;
  }
  .note { font-size: 12px; color: var(--muted); line-height: 1.8; margin: 0; }
</style>

<div class="sheet">
